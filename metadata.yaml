name: astrbot_plugin_topic_router
desc: 话题路由器 —— 让机器人自己判断用户这句话是「接着上一个话题」还是「开了新话题」。默认只标记不改上下文，确认准确后再开启自动翻篇。零第三方依赖。
help: |-
  指令：
  /topicweave 查看当前话题状态
  /topicweave new [名称] 手动翻篇（等于 /new + 重置话题）
  /topicweave forget 忘记当前话题
  /topicweave off | on 本会话开关自动判断
  /topicweave conflicts 查看指令冲突
  （别名：话题织机）

  配置里 mode 默认 mark（只记录、不改上下文），
  判定准确后再改成 auto（自动开新对话，旧对话完整留档）。
version: v0.3.2
author: dsh
repo: https://github.com/3559413914-spec/astrbot_plugin_topic_router
